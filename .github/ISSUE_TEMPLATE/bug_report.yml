name: 🐛 Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste output from the Live Logs page (or `docker logs seo-indexer`) around the failure.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or the version shown in the dashboard footer / `/api/status`.
      placeholder: v1.2.3
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Indexing runs, Google auth, IndexNow, Analytics, AI citations, llms.txt/GEO, Dashboard UI, Docker/deploy, Other]
