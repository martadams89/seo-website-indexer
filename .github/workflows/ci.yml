name: CI

# Fast feedback on every PR/push: test, typecheck, lint and build both packages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck & build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Component and client tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Theme contract
        run: npm run test:theme
      - name: Typography readability contract
        run: npm run test:typography
      - name: Dialog contract
        run: npm run test:ui
      - name: Integration guide contract
        run: npm run test:integrations
      - name: Unified Intelligence scope contract
        run: npm run test:intelligence
      - name: Action Centre remediation contract
        run: npm run test:action-centre
      - name: Typecheck & build
        run: npm run build
