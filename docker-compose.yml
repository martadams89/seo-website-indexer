services:
  seo-indexer:
    image: ghcr.io/martadams89/seo-website-indexer:latest
    # Or build locally:
    # build: .
    container_name: seo-indexer
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - seo-indexer-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      # Strongly recommended: stable secret for encrypting FTP passwords at rest
      # and signing future cookies. If unset, a per-volume key is auto-generated
      # at /data/.key (0600).
      # - APP_SECRET=please-change-me
      # Comma-separated list of allowed CORS origins. Default `*` is fine when
      # the dashboard is served from the same origin via the reverse proxy.
      # - CORS_ORIGIN=https://indexer.example.com
      # Rate limiting (defaults: 300 req / 1 minute / IP)
      # - RATE_LIMIT_MAX=300
      # - RATE_LIMIT_WINDOW=1 minute
      # Number of nightly DB backups to retain (default 7).
      # - BACKUP_KEEP=14
      # Optional: override default cron (can also be set via UI)
      # - CRON_SCHEDULE=0 3 * * *
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/livez"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  seo-indexer-data:
    driver: local

# ─── Usage ────────────────────────────────────────────────────────────────────
#
#  Start:  docker compose up -d
#  Logs:   docker compose logs -f
#  Stop:   docker compose down
#
#  Then open http://localhost:3000 in your browser.
#
#  If you want IndexNow to work WITHOUT manually placing key files on your site,
#  route your domain through this container via a reverse proxy and forward the
#  /{key}.txt path. Example nginx config:
#
#    location ~* ^/[a-f0-9]{8,128}\.txt$ {
#        proxy_pass http://seo-indexer:3000;
#    }
#
#  The container automatically serves the key file at /{key}.txt for all sites.
#
# ─── Multi-arch image build ───────────────────────────────────────────────────
#
#  docker buildx create --use --name seo-indexer || docker buildx use seo-indexer
#  docker buildx build \
#    --platform linux/amd64,linux/arm64 \
#    -t ghcr.io/<your-org>/seo-website-indexer:latest \
#    --push .
